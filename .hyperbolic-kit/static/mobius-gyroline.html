<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Modular Gyrolines</title>
    <style>
/* Theme & Base Styles */
:root {
  --size: 680px;
  --bg: #fff;
  --text-main: #0b0b0b;
  --text-muted: rgba(0,0,0,0.70);
  --card-bg: rgba(255,255,255,0.92);
  --border: rgba(0,0,0,0.14);
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 26px rgba(0,0,0,0.10);
  
  --font-serif: Georgia, "Times New Roman", Times, serif;
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex; /* Centered by default for single widget view */
  place-items: center;
  justify-content: center;
  background: #f6f6f6;
  font-family: var(--font-serif);
  color: var(--text-main);
}

/* Canvas Wrapper */
.hk-wrap {
  position: relative;
  width: min(var(--size), 92vw);
  aspect-ratio: 1/1;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  background: #fff;
  overflow: hidden; /* For corner rounding if desired */
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Overlay Standard Grid */
.hk-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-rows: auto auto 1fr;
  justify-items: center;
  padding-top: 8%;
}

.hk-title {
  text-align: center;
  font-size: clamp(18px, 3.2vw, 34px);
  line-height: 1.1;
  margin: 0 10%;
}
.hk-title em { font-style: italic; }

/* Info Card (Bottom Right) */
.hk-info {
  position: absolute;
  right: 12px;
  bottom: 24px;
  pointer-events: none;
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  color: rgba(0,0,0,0.84);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  min-width: 200px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.hk-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  white-space: nowrap;
}
.hk-label { color: var(--text-muted); }
.hk-val { font-variant-numeric: tabular-nums; }

</style>
</head>

<body>
    <div class="hk-wrap" id="app">
        <canvas id="c"></canvas>
    </div>

    <script>
// --- BUNDLED BY BUILD.PY ---
(function(){

// --- core/transform.js ---
/**
 * Vector and Coordinate Transform Utilities
 * Pure math, no DOM dependencies (except for concept of "pixels").
 */
const EPS = 1e-10;
const TAU = Math.PI * 2;

// --- Basic Vector Ops ---
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const scale = (v, s) => ({ x: v.x * s, y: v.y * s });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const norm2 = (v) => v.x * v.x + v.y * v.y;
const norm = (v) => Math.hypot(v.x, v.y);
const neg = (v) => ({ x: -v.x, y: -v.y });
const perp = (v) => ({ x: -v.y, y: v.x });
const unit = (v) => {
    const r = norm(v);
    if (r < EPS) return { x: 1, y: 0 };
    return scale(v, 1 / r);
};
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const clampToDisk = (v, maxR = 0.999) => {
    const r = norm(v);
    if (r <= maxR) return v;
    return scale(v, maxR / r);
};

// --- Coordinate Transforms ---
// geom = { w, h, R, cx, cy }
const diskToPx = (v, geom) => ({
    x: geom.cx + v.x * geom.R,
    y: geom.cy - v.y * geom.R,
});
const pxToDisk = (p, geom) => ({
    x: (p.x - geom.cx) / geom.R,
    y: (geom.cy - p.y) / geom.R,
});

// --- core/poincare.js ---
/**
 * Poincaré Disk Model Primitives
 * Möbius addition, scalar multiplication, and hyperbolic metrics.
 */
const MAX_ATANH = 0.999999999;

// Möbius addition: a ⊕ b
function mobiusAdd(a, b) {
    const a2 = norm2(a);
    const b2 = norm2(b);
    const ab = dot(a, b);
    const denom = 1 + 2 * ab + a2 * b2;
    return {
        x: ((1 + 2 * ab + b2) * a.x + (1 - a2) * b.x) / denom,
        y: ((1 + 2 * ab + b2) * a.y + (1 - a2) * b.y) / denom
    };
}

// Möbius scalar multiplication: t ⊗ v
// r⊗v = tanh(r * atanh(|v|)) * (v/|v|)
function mobiusScalar(t, v) {
    const r = norm(v);
    if (r < EPS) return { x: 0, y: 0 };
    const rr = Math.min(r, MAX_ATANH);
    const k = Math.tanh(t * Math.atanh(rr)) / r;
    return scale(v, k);
}

// Gyroline point: P(t) = A ⊕ (⊖A ⊕ B)⊗t
function gyroPoint(A, B, t) {
    const negA = { x: -A.x, y: -A.y };
    const delta = mobiusAdd(negA, B);
    return mobiusAdd(A, mobiusScalar(t, delta));
}

// Hyperbolic distance: d_H(x,y)
function hypDist(x, y) {
    const negX = { x: -x.x, y: -x.y };
    const d = mobiusAdd(negX, y);
    const r = Math.min(MAX_ATANH, norm(d));
    return 2 * Math.atanh(r);
}

// Hyperbolic radius from origin: ρ(v)
function hypRadius(v) {
    const r = Math.min(MAX_ATANH, norm(v));
    return 2 * Math.atanh(r);
}

// --- core/geodesic.js ---
/**
 * Geodesic Engine
 * Computes Euclidean circles/lines representing hyperbolic geodesics.
 */
function mod2pi(x) {
    x = x % TAU;
    if (x < 0) x += TAU;
    return x;
}

// Compute geodesic passing through P and Q.
// Returns { type: "diameter", u } or { type: "circle", c, r }
function geodesicFromTwoPoints(P, Q) {
    const det = cross(P, Q);
    if (Math.abs(det) < 1e-8) {
        // Collinear with origin -> diameter
        const u = unit(norm(P) > EPS ? P : (norm(Q) > EPS ? Q : { x: 1, y: 0 }));
        return { type: "diameter", u };
    }
    // Circle orthogonal to unit disk
    const k1 = (1 + norm2(P)) / 2;
    const k2 = (1 + norm2(Q)) / 2;
    const invDet = 1 / det;
    const cx = (k1 * Q.y - k2 * P.y) * invDet;
    const cy = (-k1 * Q.x + k2 * P.x) * invDet;
    const c = { x: cx, y: cy };
    const r2 = norm2(c) - 1;
    const r = Math.sqrt(Math.max(r2, 0));
    return { type: "circle", c, r };
}

// Compute geodesic through M with tangent direction tDir.
function geodesicFromPointTangent(M, tDir) {
    const t = unit(tDir);
    if (norm(M) < EPS) {
        return { type: "diameter", u: t };
    }
    if (Math.abs(cross(M, t)) < 1e-8) {
        return { type: "diameter", u: unit(M) };
    }
    const n = unit(perp(t));
    const denom = 2 * dot(M, n);
    if (Math.abs(denom) < 1e-10) {
        return { type: "diameter", u: t };
    }
    const s = (1 - norm2(M)) / denom;
    const c = add(M, scale(n, s));
    const r2 = norm2(c) - 1;
    const r = Math.sqrt(Math.max(r2, 0));
    return { type: "circle", c, r };
}

// Find intersections of a circle (c,r) with the unit circle.
function circleIntersectionsUnit(c, r) {
    const d = norm(c);
    // a is distance from c center to chord; h is half-length of chord
    const a = (1 - r * r + d * d) / (2 * d);
    const h2 = 1 - a * a;
    const h = Math.sqrt(Math.max(h2, 0));
    const p2 = scale(c, a / d);
    const v = scale(perp(c), h / d);
    return [add(p2, v), sub(p2, v)];
}

// Sample points along the geodesic arc inside the disk.
function sampleGeodesic(g, N = 400) {
    if (g.type === "diameter") {
        const pts = [];
        for (let i = 0; i <= N; i++) {
            // sample from -0.999 to +0.999
            const s = -0.999 + (1.998) * i / N;
            pts.push(scale(g.u, s));
        }
        return pts;
    }

    // Circle case
    const [I1, I2] = circleIntersectionsUnit(g.c, g.r);
    const a1 = Math.atan2(I1.y - g.c.y, I1.x - g.c.x);
    const a2 = Math.atan2(I2.y - g.c.y, I2.x - g.c.x);

    const dccw = mod2pi(a2 - a1);
    const midCcw = a1 + dccw / 2;
    const midPt = add(g.c, { x: g.r * Math.cos(midCcw), y: g.r * Math.sin(midCcw) });

    // Decide which arc is inside the unit disk
    let delta = dccw;
    if (norm(midPt) >= 1 - 1e-6) {
        delta = dccw - TAU;
    }

    const pts = [];
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const ang = a1 + delta * t;
        const p = add(g.c, { x: g.r * Math.cos(ang), y: g.r * Math.sin(ang) });
        pts.push(clampToDisk(p, 0.999999));
    }
    return pts;
}

// --- ui/overlay.js ---
/**
 * UI Overlay Factory
 * Injects the standard HTML structure into a container.
 */
function createOverlay(container, { title, subtitle, formula }) {
    const overlay = document.createElement('div');
    overlay.className = 'hk-overlay';

    let html = `
    <div class="hk-title">
      ${title}
    </div>
  `;

    if (subtitle) {
        html += `<div style="margin-top:8px; opacity:0.8;">${subtitle}</div>`;
    }

    if (formula) {
        html += `
      <div style="margin-top:12px; display:grid; justify-items:center; gap:8px;">
        <div style="
          border:2px solid #000; padding:8px 14px;
          font-size:clamp(18px,2.6vw,34px); line-height:1;
          background:rgba(255,255,255,0.92);
        ">${formula}</div>
      </div>
    `;
    }

    // Grid spacer
    html += `<div></div>`;

    overlay.innerHTML = html;
    container.appendChild(overlay);

    // Optional info box
    const info = document.createElement('div');
    info.className = 'hk-info';
    container.appendChild(info);

    return {
        updateInfo: (rows) => {
            // rows = [ { label, val }, ... ]
            info.innerHTML = rows.map(r =>
                `<div class="hk-row"><span class="hk-label">${r.label}</span><span class="hk-val">${r.val}</span></div>`
            ).join('');
        }
    };
}

// --- engine/canvas.js ---
/**
 * Canvas Engine
 * Handles high-DPR setup and resize loops.
 */
function setupCanvas(canvas, onDraw) {
    const ctx = canvas.getContext("2d");

    const resize = () => {
        // Look up to the wrap? or just custom size?
        // Usually we want to fill the parent
        const parent = canvas.parentElement;
        if (!parent) return;

        const rect = parent.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);

        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // normalize coordinate system

        if (onDraw) onDraw({ width: rect.width, height: rect.height, ctx });
    };

    window.addEventListener("resize", resize);

    // Initial size
    resize();

    return {
        resize,
        ctx
    };
}
function getDiskGeometry(width, height) {
    // Standard margin
    const pad = 20;
    const R = Math.min(width, height) / 2 - pad;
    return {
        w: width,
        h: height,
        R,
        cx: width / 2,
        cy: height / 2
    };
}

// --- engine/interact.js ---
/**
 * Interaction Engine
 * standardized drag handlers for canvas items.
 */
function createInteraction(canvas, geomFn, state, onDrag) {
    let dragging = null;

    const hitTest = (ptPx) => {
        // Check all draggable keys in state
        // We expect state keys that match "draggable" items
        // For now, simpler: user passes a custom hitTest function or we iterate keys
        // Let's iterate keys that look like points {x,y}
        const geom = geomFn();
        const hitR = 20; // px

        // We assume state has properties that are points.
        // But to be generic, let's reverse it: the caller provides a "hitTest" callback?
        // Or we provide a helper "checkHits"

        // Let's do: caller provides `getDraggables()` -> returns { key: {x,y}, ... }
    };

    const getPointerPos = (e) => {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX ?? e.touches?.[0]?.clientX) - r.left;
        const y = (e.clientY ?? e.touches?.[0]?.clientY) - r.top;
        return { x, y };
    };

    const handleStart = (e) => {
        const p = getPointerPos(e);
        // Ask caller what was hit
        if (state.hitTest) {
            const hit = state.hitTest(p);
            if (hit) {
                dragging = hit;
                e.preventDefault();
            }
        }
    };

    const handleMove = (e) => {
        if (!dragging) return;
        const p = getPointerPos(e);
        // Convert to disk coordinates for the callback
        // The callback receives (key, pxPos) and decides what to do
        onDrag(dragging, p);
        e.preventDefault();
    };

    const handleEnd = () => {
        dragging = null;
    };

    // Mouse
    canvas.addEventListener("mousedown", handleStart);
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleEnd);

    // Touch
    canvas.addEventListener("touchstart", handleStart, { passive: false });
    window.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd);
}

// --- mobius-gyroline/script.js ---
import {
    add, sub, scale, norm, norm2, unit, perp,
    diskToPx, pxToDisk, clampToDisk, TAU
} from '../../core/transform.js';
import {
    gyroPoint, hypDist, hypRadius
} from '../../core/poincare.js';
import {
    geodesicFromTwoPoints, geodesicFromPointTangent, sampleGeodesic
} from '../../core/geodesic.js';




// --- State ---
let A = clampToDisk({ x: 0.68, y: 0.10 });
let B = clampToDisk({ x: 0.30, y: 0.30 });

// --- UI Setup ---
const app = document.getElementById('app');
const canvas = document.getElementById('c');

const ui = createOverlay(app, {
    title: `The Möbius Gyroline <span style="font-style:italic">L<sub>AB</sub></span>`,
    formula: `A ⊕ (⊖A ⊕ B) ⊗ t`
});

// --- Drawing Loop ---
function draw({ ctx, width, height }) {
    const geom = getDiskGeometry(width, height);
    const { R, cx, cy } = geom;

    ctx.clearRect(0, 0, width, height);

    // 1. Boundary
    ctx.save();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = "#000";
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // 2. Calculations
    const M = gyroPoint(A, B, 0.5);
    const dAB = hypDist(A, B);

    // Tangents & Orthogonal Curves (Logic ported exactly from gyro.html)
    const g1 = geodesicFromTwoPoints(A, B);
    let tangent1;
    if (g1.type === "diameter") {
        tangent1 = g1.u;
    } else {
        // tangent is perpendicular to radius at M
        tangent1 = unit(perp(sub(M, g1.c)));
    }
    const tangent2 = unit(perp(tangent1));
    const g2 = geodesicFromPointTangent(M, tangent2);

    // 3. Draw Curves (Clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R - 0.5, 0, TAU);
    ctx.clip();

    // Gyroline A->B (black thick)
    // Sampling: direct gyroPoint evaluation
    const N = 400;
    ctx.lineWidth = 6.0;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
        const t = -3 + (6) * i / N; // t in [-3, 3]
        const P = gyroPoint(A, B, t);
        const pp = diskToPx(P, geom);
        if (i === 0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
    }
    ctx.stroke();

    // Orthogonal Geodesic (red dotted)
    const pts2 = sampleGeodesic(g2, 400);
    ctx.lineWidth = 2.5;
    ctx.setLineDash([3, 7]);
    ctx.strokeStyle = "red";
    if (pts2.length) {
        const p0 = diskToPx(pts2[0], geom);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < pts2.length; i++) {
            const p = diskToPx(pts2[i], geom);
            ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }

    ctx.restore(); // end clip

    // 4. Draw Points (A, B)
    const drawPt = (pt, label) => {
        const p = diskToPx(pt, geom);
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 9, 0, TAU);
        ctx.fill();

        // Simple label
        ctx.font = "italic 20px Georgia";
        ctx.fillText(label, p.x + 12, p.y - 12);
    };

    drawPt(A, "A");
    drawPt(B, "B");

    // 5. Update Stats
    ui.updateInfo([
        { label: "A: r²", val: norm2(A).toFixed(3) },
        { label: "B: r²", val: norm2(B).toFixed(3) },
        { label: "dₕ(A,B)", val: dAB.toFixed(3) },
    ]);
}

// --- Interaction wire-up ---
const { resize, ctx } = setupCanvas(canvas, draw);

createInteraction(canvas,
    () => getDiskGeometry(canvas.width, canvas.height), // geom provider
    {
        // Hit Test Logic
        hitTest: (ptPx) => {
            const geom = getDiskGeometry(canvas.width, canvas.height);
            const aPx = diskToPx(A, geom);
            const bPx = diskToPx(B, geom);
            const da = Math.hypot(ptPx.x - aPx.x, ptPx.y - aPx.y);
            const db = Math.hypot(ptPx.x - bPx.x, ptPx.y - bPx.y);
            if (da < 20) return "A";
            if (db < 20) return "B";
            return null;
        }
    },
    // Drag Callback
    (key, ptPx) => {
        const geom = getDiskGeometry(canvas.width, canvas.height);
        const v = clampToDisk(pxToDisk(ptPx, geom), 0.999);

        if (key === "A") A = v;
        if (key === "B") B = v;

        // Redraw
        draw({ ctx, width: canvas.width, height: canvas.height });
    }
);

})();
</script>
</body>
