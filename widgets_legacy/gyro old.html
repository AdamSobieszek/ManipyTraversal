<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Möbius Gyrolines (Poincaré Disk) – Drag A and B</title>
  <style>
    :root { --size: 680px; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; background:#fff;
      font-family: Georgia, "Times New Roman", Times, serif;
    }
    .wrap{
      position:relative; width:min(var(--size),92vw); aspect-ratio:1/1;
      user-select:none; -webkit-user-select:none; touch-action:none;
    }
    canvas{ width:100%; height:100%; display:block; }
    .overlay{
      position:absolute; inset:0; pointer-events:none;
      display:grid; grid-template-rows:auto auto 1fr; justify-items:center;
      padding-top:10%;
    }
    .title{
      text-align:center; font-size:clamp(18px,3.2vw,38px);
      line-height:1.1; margin:0 10%;
    }
    .title .italic{ font-style:italic; }
    .formula{ margin-top:12px; display:grid; justify-items:center; gap:8px; }
    .box{
      border:2px solid #000; padding:8px 14px;
      font-size:clamp(18px,2.6vw,34px); line-height:1;
      background:rgba(255,255,255,0.92);
    }
    .tRange{ font-size:clamp(16px,2.2vw,30px); }
    .hint{
      position:absolute; left:50%; transform:translateX(-50%); bottom:10px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:12px; color:#333; pointer-events:none; opacity:.8;
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <canvas id="c"></canvas>

    <div class="overlay">
      <div class="title">
        The Möbius Gyroline <span class="italic">L<sub>AB</sub></span><br/>
        through the points <span class="italic">A</span> and <span class="italic">B</span>
      </div>
      <div class="formula">
        <div class="box">A ⊕ (⊖A ⊕ B) ⊗ t</div>
        <div class="tRange">−∞ &lt; t &lt; ∞</div>
      </div>
      <div></div>
    </div>

    <div class="hint">Drag the points A and B inside the disk</div>
  </div>

  <script>
    // ---------- math helpers ----------
    const EPS = 1e-10;
    const TAU = Math.PI * 2;

    function norm2(v){ return v.x*v.x + v.y*v.y; }
    function norm(v){ return Math.hypot(v.x, v.y); }
    function dot(a,b){ return a.x*b.x + a.y*b.y; }
    function cross(a,b){ return a.x*b.y - a.y*b.x; }
    function add(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
    function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
    function scale(v,s){ return {x:v.x*s, y:v.y*s}; }
    function neg(v){ return {x:-v.x, y:-v.y}; }
    function perp(v){ return {x:-v.y, y:v.x}; }
    function unit(v){
      const r = norm(v);
      if (r < EPS) return {x:1, y:0};
      return scale(v, 1/r);
    }
    function clampToDisk(v, maxR=0.999){
      const r = norm(v);
      if (r <= maxR) return v;
      return scale(v, maxR / r);
    }

    // Möbius addition (unit disk, curvature -1)
    function mobiusAdd(a,b){
      const a2 = norm2(a), b2 = norm2(b), ab = dot(a,b);
      const denom = 1 + 2*ab + a2*b2;
      return {
        x: ((1 + 2*ab + b2)*a.x + (1 - a2)*b.x) / denom,
        y: ((1 + 2*ab + b2)*a.y + (1 - a2)*b.y) / denom
      };
    }

    // Scalar multiplication: t ⊗ v
    function mobiusScalar(t, v){
      const r = norm(v);
      if (r < EPS) return {x:0, y:0};
      const rr = Math.min(r, 0.999999999);
      const k = Math.tanh(t * Math.atanh(rr)) / r;
      return scale(v, k);
    }

    // Gyroline: A ⊕ ((⊖A ⊕ B) ⊗ t)
    function gyroPoint(A,B,t){
      const delta = mobiusAdd(neg(A), B);
      return mobiusAdd(A, mobiusScalar(t, delta));
    }

    // ---------- Geodesic circle utilities (Poincaré disk) ----------
    // Geodesic through P,Q is either a diameter (if P,Q,0 collinear) or a circle orthogonal to unit circle.
    function geodesicFromTwoPoints(P,Q){
      const det = cross(P,Q);
      if (Math.abs(det) < 1e-8) {
        // diameter through origin in direction of P (or Q)
        const u = unit(norm(P) > EPS ? P : (norm(Q) > EPS ? Q : {x:1,y:0}));
        return { type:"diameter", u };
      }
      // Solve [Px Py; Qx Qy] c = [(1+|P|^2)/2; (1+|Q|^2)/2]
      const k1 = (1 + norm2(P)) / 2;
      const k2 = (1 + norm2(Q)) / 2;
      const invDet = 1 / det;
      const cx = ( k1*Q.y - k2*P.y) * invDet;
      const cy = (-k1*Q.x + k2*P.x) * invDet;
      const c = {x:cx, y:cy};
      const r2 = norm2(c) - 1;
      const r = Math.sqrt(Math.max(r2, 0));
      return { type:"circle", c, r };
    }

    function circleIntersectionsUnit(c,r){
      const d = norm(c);
      // unit circle radius R1=1, other radius R2=r
      // a = (R1^2 - R2^2 + d^2) / (2d)
      const a = (1 - r*r + d*d) / (2*d);
      const h2 = 1 - a*a;
      const h = Math.sqrt(Math.max(h2, 0));
      const p2 = scale(c, a/d);
      const v = scale(perp(c), h/d);
      return [ add(p2, v), sub(p2, v) ]; // points on unit circle
    }

    function mod2pi(x){
      x = x % TAU;
      if (x < 0) x += TAU;
      return x;
    }

    function sampleGeodesic(g, N=400){
      if (g.type === "diameter") {
        const pts = [];
        for (let i=0; i<=N; i++){
          const s = -0.999 + (1.998)*i/N;
          pts.push(scale(g.u, s));
        }
        return pts;
      }
      // circle case: sample the inside arc between the two boundary intersection points
      const [I1,I2] = circleIntersectionsUnit(g.c, g.r);
      const a1 = Math.atan2(I1.y - g.c.y, I1.x - g.c.x);
      const a2 = Math.atan2(I2.y - g.c.y, I2.x - g.c.x);

      // choose arc direction (ccw vs cw) whose midpoint lies inside disk
      const dccw = mod2pi(a2 - a1);          // in [0,2π)
      const midCcw = a1 + dccw/2;
      const midPt = add(g.c, {x: g.r*Math.cos(midCcw), y: g.r*Math.sin(midCcw)});
      let delta = dccw;
      if (norm(midPt) >= 1 - 1e-6) {
        // take the other way around
        delta = dccw - TAU; // negative
      }

      const pts = [];
      for (let i=0; i<=N; i++){
        const t = i/N;
        const ang = a1 + delta*t;
        const p = add(g.c, {x: g.r*Math.cos(ang), y: g.r*Math.sin(ang)});
        // (Should already be in-disk for the chosen arc, but clamp tiny numeric drift)
        pts.push(clampToDisk(p, 0.999999));
      }
      return pts;
    }

    // Build geodesic through M with a given tangent direction tDir at M.
    // If tangent is radial (parallel to M), the geodesic is the diameter through origin along that direction.
    function geodesicFromPointTangent(M, tDir){
      const t = unit(tDir);
      if (norm(M) < EPS) {
        // through center -> any geodesic is diameter; use tangent direction
        return { type:"diameter", u: t };
      }
      if (Math.abs(cross(M, t)) < 1e-8) {
        // radial tangent -> diameter through origin
        return { type:"diameter", u: unit(M) };
      }
      const n = unit(perp(t)); // direction from M toward center of the orthogonal circle
      const denom = 2 * dot(M, n);
      if (Math.abs(denom) < 1e-10) {
        return { type:"diameter", u: t };
      }
      const s = (1 - norm2(M)) / denom;
      const c = add(M, scale(n, s));
      const r2 = norm2(c) - 1;
      const r = Math.sqrt(Math.max(r2, 0));
      return { type:"circle", c, r };
    }

    // ---------- canvas setup ----------
    const canvas = document.getElementById("c");
    const wrap = document.getElementById("wrap");
    const ctx = canvas.getContext("2d");

    function resize(){
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width  = Math.round(rect.width  * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0); // draw in CSS pixels
      draw();
    }
    window.addEventListener("resize", resize);

    // ---------- state ----------
    let A = clampToDisk({x: 0.68, y: 0.10});
    let B = clampToDisk({x: 0.30, y: 0.30});
    let dragging = null; // "A" | "B" | null

    // ---------- coordinate transforms ----------
    function geom(){
      const w = wrap.getBoundingClientRect().width;
      const h = wrap.getBoundingClientRect().height;
      const pad = 18;
      const R = Math.min(w,h)/2 - pad;
      return {w,h,R,cx:w/2,cy:h/2};
    }
    function diskToPx(v){
      const {R,cx,cy} = geom();
      return { x: cx + v.x*R, y: cy - v.y*R };
    }
    function pxToDisk(p){
      const {R,cx,cy} = geom();
      return { x: (p.x - cx)/R, y: (cy - p.y)/R };
    }
    function pointerPos(ev){
      const r = wrap.getBoundingClientRect();
      const x = (ev.clientX ?? ev.touches?.[0]?.clientX) - r.left;
      const y = (ev.clientY ?? ev.touches?.[0]?.clientY) - r.top;
      return {x,y};
    }

    // ---------- drawing ----------
    function drawPolyline(pts){
      if (!pts.length) return;
      const p0 = diskToPx(pts[0]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      for (let i=1; i<pts.length; i++){
        const p = diskToPx(pts[i]);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function fmtE(v){
      // Euclidean squared distance from center in disk coordinates
      return (norm2(v)).toFixed(3);
    }

    function draw(){
      const {w,h,R,cx,cy} = geom();
      ctx.clearRect(0,0,w,h);

      // boundary circle
      ctx.save();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = "#000";
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.stroke();
      ctx.restore();

      // compute midpoint on the first gyroline (hyperbolic midpoint in this parameterization)
      const M = gyroPoint(A,B,0.5);

      // compute tangent of first geodesic at M via its geodesic object (exact)
      const g1 = geodesicFromTwoPoints(A,B);
      let tangent1;
      if (g1.type === "diameter") {
        tangent1 = g1.u;
      } else {
        // tangent is perpendicular to radius at M
        tangent1 = unit(perp(sub(M, g1.c)));
      }

      // second geodesic: orthogonal at M, so tangent2 ⟂ tangent1
      const tangent2 = unit(perp(tangent1));
      const g2 = geodesicFromPointTangent(M, tangent2);

      // clip to disk for curves
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R-0.5, 0, TAU);
      ctx.clip();

      // draw first gyroline (thick black) using gyro-sampling
      const T = 5.0, N = 900;
      ctx.save();
      ctx.lineWidth = 7.5;
      ctx.lineCap = "round";
      ctx.setLineDash([]);
      ctx.strokeStyle = "#000";
      ctx.beginPath();
      for (let i=0; i<=N; i++){
        const t = -T + (2*T)*i/N;
        const P = gyroPoint(A,B,t);
        const pp = diskToPx(P);
        if (i===0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
      }
      ctx.stroke();
      ctx.restore();

      // draw second (orthogonal) gyroline (dotted red)
      const pts2 = sampleGeodesic(g2, 520);
      ctx.save();
      ctx.lineWidth = 3.2;
      ctx.lineCap = "round";
      ctx.setLineDash([2.5, 9]);   // dotted look
      ctx.strokeStyle = "red";
      drawPolyline(pts2);
      ctx.restore();

      ctx.restore(); // end clip

      // points
      function drawPoint(v){
        const p = diskToPx(v);
        ctx.save();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 9, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      drawPoint(A);
      drawPoint(B);

      // labels with E=...
      const Ap = diskToPx(A);
      const Bp = diskToPx(B);

      ctx.save();
      ctx.fillStyle = "#000";
      ctx.textBaseline = "middle";

      // A label
      ctx.font = "italic 24px Georgia, Times, serif";
      ctx.fillText("A,", Ap.x + 14, Ap.y - 14);
      ctx.font = "24px Georgia, Times, serif";
      ctx.fillText(` t = 0  E=${fmtE(A)}`, Ap.x + 40, Ap.y - 14);

      // B label
      ctx.font = "italic 24px Georgia, Times, serif";
      ctx.fillText("B,", Bp.x + 14, Bp.y + 18);
      ctx.font = "24px Georgia, Times, serif";
      ctx.fillText(` t = 1  E=${fmtE(B)}`, Bp.x + 40, Bp.y + 18);

      ctx.restore();
    }

    // ---------- interaction ----------
    function hitTest(ptPx){
      const aPx = diskToPx(A);
      const bPx = diskToPx(B);
      const da = Math.hypot(ptPx.x - aPx.x, ptPx.y - aPx.y);
      const db = Math.hypot(ptPx.x - bPx.x, ptPx.y - bPx.y);
      const hitR = 16;
      if (da < hitR) return "A";
      if (db < hitR) return "B";
      return null;
    }

    function setDragged(which, ptPx){
      let v = clampToDisk(pxToDisk(ptPx), 0.999);
      if (which === "A") A = v;
      if (which === "B") B = v;
      draw();
    }

    // Mouse
    wrap.addEventListener("mousedown", (e) => {
      const p = pointerPos(e);
      const h = hitTest(p);
      if (h){ dragging = h; e.preventDefault(); }
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      setDragged(dragging, pointerPos(e));
    });
    window.addEventListener("mouseup", () => dragging = null);

    // Touch
    wrap.addEventListener("touchstart", (e) => {
      const p = pointerPos(e);
      const h = hitTest(p);
      if (h){ dragging = h; e.preventDefault(); }
    }, {passive:false});
    window.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      setDragged(dragging, pointerPos(e));
      e.preventDefault();
    }, {passive:false});
    window.addEventListener("touchend", () => dragging = null);

    resize();
  </script>
</body>

      }
      const n = unit(perp(t)); // direction from M toward center of the orthogonal circle
      const denom = 2 * dot(M, n);
      if (Math.abs(denom) < 1e-10) {
        return { type:"diameter", u: t };
      }
      const s = (1 - norm2(M)) / denom;
      const c = add(M, scale(n, s));
      const r2 = norm2(c) - 1;
      const r = Math.sqrt(Math.max(r2, 0));
      return { type:"circle", c, r };
    }

    // ---------- canvas setup ----------
    const canvas = document.getElementById("c");
    const wrap = document.getElementById("wrap");
    const ctx = canvas.getContext("2d");

    function resize(){
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width  = Math.round(rect.width  * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0); // draw in CSS pixels
      draw();
    }
    window.addEventListener("resize", resize);

    // ---------- state ----------
    let A = clampToDisk({x: 0.68, y: 0.10});
    let B = clampToDisk({x: 0.30, y: 0.30});
    let dragging = null; // "A" | "B" | null

    // ---------- coordinate transforms ----------
    function geom(){
      const w = wrap.getBoundingClientRect().width;
      const h = wrap.getBoundingClientRect().height;
      const pad = 18;
      const R = Math.min(w,h)/2 - pad;
      return {w,h,R,cx:w/2,cy:h/2};
    }
    function diskToPx(v){
      const {R,cx,cy} = geom();
      return { x: cx + v.x*R, y: cy - v.y*R };
    }
    function pxToDisk(p){
      const {R,cx,cy} = geom();
      return { x: (p.x - cx)/R, y: (cy - p.y)/R };
    }
    function pointerPos(ev){
      const r = wrap.getBoundingClientRect();
      const x = (ev.clientX ?? ev.touches?.[0]?.clientX) - r.left;
      const y = (ev.clientY ?? ev.touches?.[0]?.clientY) - r.top;
      return {x,y};
    }

    // ---------- drawing ----------
    function drawPolyline(pts){
      if (!pts.length) return;
      const p0 = diskToPx(pts[0]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      for (let i=1; i<pts.length; i++){
        const p = diskToPx(pts[i]);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function fmtE(v){
      // Euclidean squared distance from center in disk coordinates
      return (norm2(v)).toFixed(3);
    }

    function draw(){
      const {w,h,R,cx,cy} = geom();
      ctx.clearRect(0,0,w,h);

      // boundary circle
      ctx.save();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = "#000";
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.stroke();
      ctx.restore();

      // compute midpoint on the first gyroline (hyperbolic midpoint in this parameterization)
      const M = gyroPoint(A,B,0.5);

      // compute tangent of first geodesic at M via its geodesic object (exact)
      const g1 = geodesicFromTwoPoints(A,B);
      let tangent1;
      if (g1.type === "diameter") {
        tangent1 = g1.u;
      } else {
        // tangent is perpendicular to radius at M
        tangent1 = unit(perp(sub(M, g1.c)));
      }

      // second geodesic: orthogonal at M, so tangent2 ⟂ tangent1
      const tangent2 = unit(perp(tangent1));
      const g2 = geodesicFromPointTangent(M, tangent2);

      // clip to disk for curves
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R-0.5, 0, TAU);
      ctx.clip();

      // draw first gyroline (thick black) using gyro-sampling
      const T = 5.0, N = 900;
      ctx.save();
      ctx.lineWidth = 7.5;
      ctx.lineCap = "round";
      ctx.setLineDash([]);
      ctx.strokeStyle = "#000";
      ctx.beginPath();
      for (let i=0; i<=N; i++){
        const t = -T + (2*T)*i/N;
        const P = gyroPoint(A,B,t);
        const pp = diskToPx(P);
        if (i===0) ctx.moveTo(pp.x, pp.y);
        else ctx.lineTo(pp.x, pp.y);
      }
      ctx.stroke();
      ctx.restore();

      // draw second (orthogonal) gyroline (dotted red)
      const pts2 = sampleGeodesic(g2, 520);
      ctx.save();
      ctx.lineWidth = 3.2;
      ctx.lineCap = "round";
      ctx.setLineDash([2.5, 9]);   // dotted look
      ctx.strokeStyle = "red";
      drawPolyline(pts2);
      ctx.restore();

      ctx.restore(); // end clip

      // points
      function drawPoint(v){
        const p = diskToPx(v);
        ctx.save();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 9, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      drawPoint(A);
      drawPoint(B);

      // labels with E=...
      const Ap = diskToPx(A);
      const Bp = diskToPx(B);

      ctx.save();
      ctx.fillStyle = "#000";
      ctx.textBaseline = "middle";

      // A label
      ctx.font = "italic 24px Georgia, Times, serif";
      ctx.fillText("A,", Ap.x + 14, Ap.y - 14);
      ctx.font = "24px Georgia, Times, serif";
      ctx.fillText(` t = 0  E=${fmtE(A)}`, Ap.x + 40, Ap.y - 14);

      // B label
      ctx.font = "italic 24px Georgia, Times, serif";
      ctx.fillText("B,", Bp.x + 14, Bp.y + 18);
      ctx.font = "24px Georgia, Times, serif";
      ctx.fillText(` t = 1  E=${fmtE(B)}`, Bp.x + 40, Bp.y + 18);

      ctx.restore();
    }

    // ---------- interaction ----------
    function hitTest(ptPx){
      const aPx = diskToPx(A);
      const bPx = diskToPx(B);
      const da = Math.hypot(ptPx.x - aPx.x, ptPx.y - aPx.y);
      const db = Math.hypot(ptPx.x - bPx.x, ptPx.y - bPx.y);
      const hitR = 16;
      if (da < hitR) return "A";
      if (db < hitR) return "B";
      return null;
    }

    function setDragged(which, ptPx){
      let v = clampToDisk(pxToDisk(ptPx), 0.999);
      if (which === "A") A = v;
      if (which === "B") B = v;
      draw();
    }

    // Mouse
    wrap.addEventListener("mousedown", (e) => {
      const p = pointerPos(e);
      const h = hitTest(p);
      if (h){ dragging = h; e.preventDefault(); }
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      setDragged(dragging, pointerPos(e));
    });
    window.addEventListener("mouseup", () => dragging = null);

    // Touch
    wrap.addEventListener("touchstart", (e) => {
      const p = pointerPos(e);
      const h = hitTest(p);
      if (h){ dragging = h; e.preventDefault(); }
    }, {passive:false});
    window.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      setDragged(dragging, pointerPos(e));
      e.preventDefault();
    }, {passive:false});
    window.addEventListener("touchend", () => dragging = null);

    resize();
  </script>
</body>
</html>
